<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品与话题 · Daily Nexus</title><link rel="stylesheet" href="../shared/content.css?v=20261008-1"><link rel="stylesheet" href="content-tabs.css?v=20261009-1"><link rel="stylesheet" href="page.css?v=20261009-1"></head><body class="hub-page"><div class="story-shell"><aside class="story-sidebar"><a class="story-brand" href="../daily-nexus/?view=tools">◈ <span>作品与话题<small>Daily Nexus 工具箱</small></span></a><nav id="nav" aria-label="内容板块"><button class="nav-item" data-tab="works"><span aria-hidden="true">⌘</span>作品地图</button><button class="nav-item" data-tab="topics"><span aria-hidden="true">◌</span>兴趣话题</button><button class="nav-item" data-tab="anime"><span aria-hidden="true">▶</span>番剧分集</button><button class="nav-item" data-tab="discovery"><span aria-hidden="true">✦</span>完结作品库</button></nav><div class="story-footer"><a href="../tsugi-checker/">追更与书架 ↗</a><button id="toggleTheme" aria-label="切换深浅主题">◐ 外观</button></div></aside><main class="story-main"><section id="works" class="tab"><div class="hub-top"><div><span class="hub-kicker">WORK ATLAS</span><h1>作品地图</h1></div><button class="hub-btn" id="worksExport">导出收藏</button></div><div class="hub-toolbar"><form id="worksSearch"><input class="hub-input" id="worksQuery" required minlength="2" maxlength="180" placeholder="搜索小说、漫画、动画或游戏"><button class="hub-btn primary" id="worksSearchBtn">查找作品</button></form></div><div class="hub-toolbar" id="worksArchive"></div><p class="hub-status" id="worksStatus">从一个作品开始，查看前传、续集、外传和改编。</p><div id="worksDetail"></div><div class="hub-grid" id="worksResults"></div></section>
<section id="topics" class="tab"><div class="hub-top"><div><span class="hub-kicker">COMMUNITY</span><h1>兴趣话题 <span id="topicsCount" class="topic-count"></span></h1><p>作品讨论与数码生活，看看大家最近在聊什么。</p></div><button class="hub-btn" id="topicsRefresh">↻ 刷新</button></div><div class="topics-controls"><div class="hub-toolbar"><input class="hub-input" id="topicsQuery" placeholder="搜索话题、作品或关键词" aria-label="搜索话题"><select id="topicsSource" class="hub-input" aria-label="话题来源"><option value="all">所有社区</option><option value="bangumi">ACG · Bangumi</option><option value="v2ex">数码生活 · V2EX</option></select><select id="topicsOrder" class="hub-input" aria-label="话题排序"><option value="source">最近活跃</option><option value="replies">讨论最多</option></select><label class="topic-unread"><input type="checkbox" id="topicsUnread"> 未读</label></div><div class="topics-bottom"><p class="hub-status" id="topicsStatus"></p><details class="topic-preferences hub-note"><summary>内容偏好</summary><input class="hub-input" id="topicsBlocked" maxlength="300" placeholder="屏蔽关键词，以逗号分隔"><button class="hub-btn" id="topicsRestore">恢复隐藏帖子</button><p>标记剧透的标题默认折叠。</p></details></div></div><div id="topicsList" class="topic-list"></div><button class="hub-btn topic-more" id="topicsMore" hidden>查看更多话题</button></section>
<section id="anime" class="tab"><div class="hub-top"><div><span class="hub-kicker">ANIME1 · WATCH NEXT</span><h1>番剧分集</h1><p>来源已更新多少集，一眼看到；点击直接前往 Anime1 选集。</p></div><button class="hub-btn" id="animeRefresh">↻ 刷新</button></div><div class="hub-toolbar"><input class="hub-input" id="animeQuery" placeholder="搜索番剧名称" aria-label="搜索番剧"><select id="animeDay" class="hub-input" aria-label="连载状态"><option value="ongoing">正在连载</option><option value="all">全部作品</option><option value="completed">已完结</option><option value="special">剧场版 / 特别篇</option></select><select id="animeYear" class="hub-input" aria-label="动画年份"><option value="all">全部年份</option></select><label><input type="checkbox" id="animeFollowOnly"> 我的关注</label></div><p class="hub-status" id="animeStatus"></p><div id="animeGrid" class="anime-list"></div><button class="hub-btn topic-more" id="animeMore" hidden>查看更多番剧</button></section>
<section id="discovery" class="tab"><div class="hub-top"><div><span class="hub-kicker">FIND YOUR NEXT STORY</span><h1>完结作品库</h1></div><button class="hub-btn" id="discoveryRefresh">刷新</button></div><div class="hub-toolbar"><input class="hub-input" id="discoveryQuery" placeholder="筛选作品或作者"><select class="hub-input" id="discoveryType"><option value="all">小说 + 漫画</option><option value="novel">小说</option><option value="manga">漫画</option></select><select class="hub-input" id="discoveryMode"><option value="new">目录新收录</option><option value="completed">来源明确完结</option><option value="saved">已收藏</option></select></div><div class="hub-note">独立收录小说与漫画的明确完结目录，自动排除更新流已有作品。目录收录时间不等于作品出版时间。</div><p class="hub-status" id="discoveryStatus"></p><div class="hub-grid" id="discoveryGrid"></div></section>
<dialog class="hub-dialog" id="hubEpisodes"><div class="hub-top"><h2 id="episodeTitle"></h2><button class="hub-btn" id="closeEpisodes">关闭</button></div><div id="episodeList"></div></dialog>
</main></div><script src="../shared/content.js?v=20261008-1"></script><script src="content-tabs.js?v=20261009-1"></script></body></html>
