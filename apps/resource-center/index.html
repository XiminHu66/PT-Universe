<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#f5f7fa"><title>资源与额度 · PT Universe</title><link rel="stylesheet" href="./style.css"></head>
<body><aside><a class="brand" href="https://ximinhu66.github.io/PT-Universe/"><b>PT</b><span>Universe<small>资源与额度</small></span></a><nav aria-label="资源监控"><button data-view="overview" class="active">◫ <span>额度总览</span></button><button data-view="workflows">⇄ <span>全部工作流</span></button><button data-view="projects">▦ <span>项目与部署</span></button><button data-view="settings">⚙ <span>数据与设置</span></button></nav><div class="side-note"><i></i>按需读取，无后台任务<p>关闭页面后停止请求<br>不调用模型或触发 Actions</p><a href="../../">← PT Universe</a></div></aside>
<main><header><div><small>WORKSPACE / RESOURCES</small><h1 id="page-title">资源与额度</h1></div><div class="actions"><span class="pill">零新增定时任务</span><a href="./setup.html">授权设置</a><button id="connect">连接资源后台</button><button id="refresh">↻ 读取最新状态</button></div></header><p id="notice" role="status" aria-live="polite">正在读取资源清单…</p><div id="public-banner" class="banner" hidden>当前显示公开清单。连接资源后台后显示私有用量。<a href="./setup.html">查看一次性授权步骤 →</a></div><section id="workspace"></section><footer>黄色 ≥ 70% · 红色 ≥ <span id="red-label">85</span>% · 灰色表示未取得用量 · 数字均保留采样时间。预警仅在打开页面时计算。</footer></main>
<dialog id="edit-dialog"><form id="edit-form"><div class="dialog-head"><h2 id="edit-title">更新额度</h2><button type="button" id="close-edit" aria-label="关闭">×</button></div><p>从供应商控制台核对后填写。只保存在当前浏览器，不修改供应商预算。</p><label>已用量<input id="used" type="number" min="0" step="any" required></label><label>额度上限<input id="limit" type="number" min="0.000001" step="any" required></label><label>实际采样时间<input id="observed" type="datetime-local" required></label><label>备注<input id="note" maxlength="180" placeholder="例如：来自 GitHub Billing 控制台"></label><div class="actions"><button type="button" id="clear-edit">恢复来源数据</button><button class="primary">保存到此浏览器</button></div><p id="edit-error" role="alert"></p></form></dialog><script type="module" src="./app.mjs"></script></body></html>
