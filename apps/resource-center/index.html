<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#f5f7fa"><title>资源与额度 · PT Universe</title><link rel="stylesheet" href="./style.css?v=5"></head>
<body><div class="topbar"><a class="brand" href="../../"><b>PT</b><span>Universe</span></a><nav aria-label="资源监控"><button data-view="overview" class="active">总览</button><button data-view="workflows">工作流</button><button data-view="projects">项目与占用</button><button data-view="settings">读取检查</button></nav><a class="home-link" href="../../">返回主页 ↗</a></div>
<main><header><div><small>GITHUB · ORACLE VPS · CLOUDFLARE</small><h1 id="page-title">资源概览</h1></div><div class="actions"><a id="setup-link" href="./setup.html">授权说明</a><button id="connect">连接资源后台</button><button class="primary" id="refresh">↻ 检查更新</button></div></header><p id="notice" role="status" aria-live="polite">正在检查资源…</p><div id="public-banner" class="banner" hidden>当前显示公开清单，连接后可查看私有资源。<a href="./setup.html">授权说明 →</a></div><section id="workspace"></section><footer>黄色 ≥ 70% · 红色 ≥ <span id="red-label">85</span>% · 按真实采样时间判断 · 未知不判为安全</footer></main>
<dialog id="edit-dialog"><form id="edit-form"><div class="dialog-head"><h2 id="edit-title">更新额度</h2><button type="button" id="close-edit" aria-label="关闭">×</button></div><p>从供应商控制台核对后填写。只保存在当前浏览器，不修改供应商预算。</p><label>已用量<input id="used" type="number" min="0" step="any" required></label><label>额度上限<input id="limit" type="number" min="0.000001" step="any" required></label><label>实际采样时间<input id="observed" type="datetime-local" required></label><label>备注<input id="note" maxlength="180" placeholder="例如：来自 GitHub Billing 控制台"></label><div class="actions"><button type="button" id="clear-edit">恢复来源数据</button><button class="primary">保存到此浏览器</button></div><p id="edit-error" role="alert"></p></form></dialog><script type="module" src="./app.mjs?v=5"></script></body></html>
