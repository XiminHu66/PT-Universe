<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research & Knowledge Workbench · PT Universe</title><meta name="description" content="从论文收集到证据提取、方法比较和主题研究的个人工作台。"><meta name="theme-color" content="#f6f8fc"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=4"></head><body>
<aside class="sidebar"><a class="brand" href="../../"><span class="brand-icon">R<span>•</span></span><span>RESEARCH<br><small>PT UNIVERSE</small></span></a><div class="nav-label">WORKSPACE</div><nav id="nav" aria-label="研究工作区"></nav><div class="side-bottom"><button id="sync-open">↔ 备份与同步</button><span id="save-status" role="status">正在读取记录…</span><a href="../../">返回 PT Universe</a></div></aside>
<main><header class="topbar"><div><small id="eyebrow">DISCOVER / READ</small><h1 id="page-title">开始研究</h1></div><label class="global-search"><span>⌕</span><input type="search" id="global-search" placeholder="搜索论文、证据、笔记…" aria-label="全局搜索"></label><button class="primary" id="import-open">＋ 添加内容</button></header><section id="workspace"></section></main>
<dialog id="import-dialog"><div class="dialog-head"><h2>收集研究内容</h2><button data-close aria-label="关闭">×</button></div><form id="url-form"><label>URL / arXiv ID<input id="import-url" required placeholder="2404.16130 或论文 / GitHub / Hugging Face URL" maxlength="2000"></label><div class="row"><button class="primary">读取 metadata</button><button type="button" id="manual-open">手动录入 / 粘贴原文</button></div><p class="help">支持 arXiv、GitHub、Hugging Face 和常用研究网站。其他来源可手动保存。</p><p id="import-status" role="status"></p></form><form id="manual-form" hidden><label>标题<input name="title" required maxlength="600"></label><label>来源 URL<input name="url" type="url" maxlength="2000"></label><div class="two"><label>作者（逗号分隔）<input name="authors"></label><label>发表日期<input name="published" type="date"></label></div><label>Abstract<textarea name="abstract" rows="3" maxlength="15000"></textarea></label><label>原文 / 章节（空行分段）<textarea name="text" rows="7" maxlength="120000" placeholder="粘贴论文原文，保留章节名和表格说明。段落自动编号，引用与这些段落对应。"></textarea></label><button class="primary">保存到 Inbox</button><p id="manual-status" role="status"></p></form></dialog>
<dialog id="field-dialog"><div class="dialog-head"><h2 id="field-title">编辑提取</h2><button data-close aria-label="关闭">×</button></div><form id="field-form"><label>提取内容<textarea name="value" rows="4" maxlength="6000" required></textarea></label><label>原文段落<select name="paragraphId" id="field-paragraph"></select></label><label>原文引用（必须逐字匹配）<textarea name="quote" rows="4" maxlength="2000"></textarea></label><label class="check"><input name="confirmed" type="checkbox">我已核查：原文支持上述内容</label><p id="field-error" role="alert"></p><button class="primary">保存修改</button></form></dialog>
<dialog id="source-dialog" class="wide"><div class="dialog-head"><h2 id="source-title">原文与证据</h2><button data-close aria-label="关闭">×</button></div><div class="row"><a id="source-link" target="_blank" rel="noopener">打开原文</a><button id="source-pdf">PDF 预览</button></div><div id="source-body"></div></dialog>
<dialog id="text-dialog"><div class="dialog-head"><h2 id="text-title">粘贴原文</h2><button data-close aria-label="关闭">×</button></div><form id="text-form"><p class="help" id="text-help">粘贴原文，空行分段。</p><textarea id="text-input" rows="15" maxlength="120000" required></textarea><p id="text-error" role="alert"></p><button class="primary">保存</button></form></dialog>
<dialog id="entity-dialog"><div class="dialog-head"><h2>添加研究对象</h2><button data-close aria-label="关闭">×</button></div><form id="entity-form"><label>类型<select name="type" id="entity-type"></select></label><label>名称<input name="name" required maxlength="300" placeholder="例如：HotpotQA / Recall@10 / Hybrid Retrieval"></label><label>关联论文<select name="paperId" id="entity-paper"></select></label><button class="primary">添加对象</button></form></dialog>
<dialog id="relation-dialog"><div class="dialog-head"><h2>连接研究对象</h2><button data-close aria-label="关闭">×</button></div><form id="relation-form"><label>起点<select name="from"></select></label><label>关系<select name="type"><option>uses</option><option>cites</option><option>extends</option><option>evaluated_on</option><option>measured_by</option><option>reports</option><option>supports</option><option>implements</option><option>compares_with</option></select></label><label>终点<select name="to"></select></label><p id="relation-error" role="alert"></p><button class="primary">保存关系</button></form></dialog>
<dialog id="sync-dialog"><div class="dialog-head"><h2>备份与同步</h2><button data-close aria-label="关闭">×</button></div><p>论文、引用和笔记通过 PT Universe 加密同步。另一台设备连接相同配对码后共用记录。</p><label>本设备配对码<textarea id="current-code" readonly rows="2"></textarea></label><div class="row"><button id="copy-code">复制配对码</button><button id="sync-now">立即同步</button></div><p id="sync-status" role="status"></p><label>连接另一台设备<textarea id="pair-code" rows="2" placeholder="粘贴配对码；将合并两端记录"></textarea></label><button id="connect-code">连接并合并</button><p id="pair-status" role="status"></p><hr><div class="row"><button id="backup-export">导出 JSON 备份</button><button id="backup-import">导入备份</button><input id="backup-file" type="file" accept=".json,application/json" hidden></div><p class="help">完整原文会占用同步容量。同步失败时记录仍保留在本设备，可导出备份。</p></dialog>
<div id="toast" role="status" hidden></div><script type="module" src="app.mjs?v=4"></script></body></html>
