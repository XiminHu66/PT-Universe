<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="记录游戏、动画、漫画和小说，拖拽安排优先级，完成后留档。">
  <title>作品记录 · PT Universe</title>
  <link rel="icon" href="../../icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=priority1">
  <script type="module" src="./app.mjs?v=priority1"></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="back" href="../../">← PT Universe</a>
      <div class="top-actions">
        <details class="backup" id="backup-menu">
          <summary>备份</summary>
          <div class="menu">
            <button type="button" id="export">导出 JSON</button>
            <button type="button" id="import">导入 JSON</button>
            <input type="file" id="import-file" accept=".json,application/json" hidden>
          </div>
        </details>
        <a class="mode" id="mode" href="?demo=1">示例</a>
      </div>
    </div>
  </header>
  <main class="wrap">
    <header class="intro">
      <div class="intro-title">
        <span class="app-symbol" aria-hidden="true">▤</span>
        <div><p class="eyebrow">MEDIA LOG</p><h1>作品记录</h1></div>
      </div>
      <button type="button" id="add" class="primary">＋ 新增作品</button>
    </header>
    <div class="sample" id="sample" hidden>示例模式 · 这里的操作只影响当前示例。</div>
    <div class="workspace">
      <aside class="controls" aria-label="筛选作品">
        <p class="filter-heading" aria-hidden="true">作品类型</p>
        <div id="types" class="types" role="group" aria-label="作品类型"></div>
        <label class="tag-label">
          <span class="filter-heading">按标签筛选</span>
          <select id="tags"><option value="">全部标签</option></select>
        </label>
      </aside>
      <section class="results" aria-labelledby="feed-heading">
        <header class="feed-head">
          <div class="feed-title">
            <h2 id="feed-heading" class="sr-only">作品清单</h2>
            <div id="views" class="layout" role="tablist" aria-label="记录状态">
              <button id="active-tab" type="button" role="tab" data-view="active" aria-selected="true" aria-controls="feed">待补清单 <span id="active-count">0</span></button>
              <button id="archive-tab" type="button" role="tab" data-view="archive" aria-selected="false" aria-controls="feed" tabindex="-1">历史记录 <span id="archive-count">0</span></button>
            </div>
            <span id="count"></span>
          </div>
          <div class="feed-tools" id="feed-tools">
            <label class="search-label">
              <span class="sr-only">搜索作品</span>
              <input id="search" type="search" placeholder="搜索作品、进度或标签">
            </label>
            <div id="layout" class="layout" role="group" aria-label="显示方式">
              <button type="button" data-layout="grid" aria-pressed="true">卡片</button>
              <button type="button" data-layout="list" aria-pressed="false">列表</button>
            </div>
          </div>
        </header>
        <div class="feed-context">
          <label class="sort-label" id="sort-label"><span class="sr-only">排序方式</span><select id="sort">
            <option value="recent">最后记录时间</option><option value="priority">手动优先级</option>
          </select></label>
          <span class="order" id="order-hint">拖拽卡片或用 ↑ ↓ 排优先级</span>
          <div id="active-filters" class="active-filters" aria-label="已应用筛选" hidden></div>
        </div>
        <div id="feed" class="feed" data-layout="grid" role="tabpanel" aria-labelledby="active-tab"></div>
        <div id="empty" class="empty" hidden>
          <h3 id="empty-title"></h3>
          <p id="empty-copy"></p>
          <button type="button" id="empty-action"></button>
        </div>
      </section>
    </div>
    <footer id="storage">记录保存在此浏览器。可随时导出备份。</footer>
  </main>
  <p id="notice" class="notice" role="status" hidden></p>
  <dialog id="item-dialog" aria-labelledby="item-heading">
    <form id="item-form">
      <header class="dialog-head"><h2 id="item-heading">新增作品</h2><button type="button" data-close aria-label="关闭">×</button></header>
      <label>作品名称<input name="title" required maxlength="120" placeholder="输入名称" autofocus></label>
      <div class="form-pair">
        <label>类型<select name="type" required>
          <option value="game">游戏</option><option value="anime">动画</option><option value="manga">漫画</option><option value="novel">小说</option><option value="other">其他</option>
        </select></label>
        <label>标签 <span>可选</span><input name="tags" maxlength="240" placeholder="例如 Steam Deck，想补"></label>
      </div>
      <label>外链 <span>可选</span><input name="url" type="url" maxlength="2048" placeholder="https://…" inputmode="url"></label>
      <label id="initial-progress">当前进度 <span>可选</span><input name="progress" maxlength="240" placeholder="例如 看完第 7 集、打到第二章"></label>
      <p class="form-error" id="item-error" role="alert"></p>
      <footer class="form-actions">
        <button type="button" id="delete" class="danger" hidden>删除作品</button>
        <button type="button" data-close>取消</button>
        <button type="submit" class="primary">保存作品</button>
      </footer>
    </form>
  </dialog>
  <dialog id="progress-dialog" aria-labelledby="progress-heading">
    <form id="progress-form">
      <header class="dialog-head"><h2 id="progress-heading">记录进度</h2><button type="button" data-close aria-label="关闭">×</button></header>
      <p id="progress-title" class="dialog-context"></p>
      <label>最新进度<textarea name="progress" required maxlength="240" rows="3" placeholder="例如 看完第 8 集，下次从第 9 集开始" autofocus></textarea></label>
      <p class="form-error" id="progress-error" role="alert"></p>
      <footer class="form-actions">
        <button type="button" data-close>取消</button>
        <button type="submit" class="primary">保存记录</button>
      </footer>
    </form>
  </dialog>
  <dialog id="history-dialog" aria-labelledby="history-heading">
    <header class="dialog-head"><h2 id="history-heading">进度历史</h2><button type="button" data-close aria-label="关闭">×</button></header>
    <p id="history-title" class="dialog-context"></p>
    <ol id="history-list" class="history"></ol>
  </dialog>
</body>
</html>
