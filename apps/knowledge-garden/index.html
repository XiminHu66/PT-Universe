<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knowledge · PT Universe</title><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#f8fafc"><link rel="stylesheet" href="./style.css?v=auto-connect-20261025"></head><body>
<aside class="sidebar"><a class="brand" href="https://ximinhu66.github.io/PT-Universe/apps/daily-nexus/"><span class="brand-mark">▥</span> Knowledge<span class="brand-sub">PT Universe</span></a><nav aria-label="知识库"><button data-view="library" class="active">⌂ <span>全部资料</span><b id="total-count"></b></button><button data-view="inbox">▤ <span>待读</span><b id="inbox-count"></b></button><button data-view="ask">✧ <span>问知识库</span></button></nav><div class="nav-label"><span>WORKSPACES</span><button id="new-workspace" class="icon" aria-label="新建 Workspace">＋</button></div><div id="workspaces"></div><div class="side-bottom"><details><summary>整理与设置</summary><button data-view="graph">◉ 主题与关系</button><button id="settings-open">模型设置</button><button id="export">导出资料与知识</button></details><p class="storage-note">私有资料库 · VPS</p><button id="refresh" class="sync" title="刷新资料"><span id="connection">连接中…</span> ↻</button><a href="../daily-nexus/?view=tools">← 返回 Daily Nexus</a></div></aside>
<main><header><button id="mobile-menu" class="icon" aria-label="显示侧栏">☰</button><form id="search-form" class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索你的资料…" aria-label="搜索资料"><kbd>/</kbd></form><button id="search-ask" class="ask-shortcut">✧ 提问</button><button class="primary" id="add-open">＋ 新增</button></header><div class="page-head"><div><p class="breadcrumb" id="scope-label">个人知识库</p><h1 id="title">全部资料</h1></div><div id="page-actions"></div></div><div id="backend-banner" class="backend-banner" hidden><div><strong>资料库连接未完成</strong><p>将复用 VPS 已有登录并自动返回。只有登录过期时才需要重新登录。</p></div><button class="primary" id="backend-connect">重试连接 →</button></div><div id="notice" role="status" hidden></div><section id="workspace"></section></main>
<dialog id="add-dialog"><div class="dialog-head"><h2>新增资料</h2><button data-close aria-label="关闭新增">×</button></div><div class="tabs" id="add-tabs"><button data-add-type="link" class="active">网页</button><button data-add-type="file">PDF / 文件</button><button data-add-type="note">笔记</button></div><form id="add-form"><div id="add-fields"></div><label>Workspace<select name="workspaceId" id="add-workspace"></select></label><details class="optional"><summary>补充说明（可选）</summary><label>保存原因<textarea name="reason" rows="2" maxlength="1500" placeholder="为什么留下它？"></textarea></label><div class="two"><label>分类<input name="category" list="category-options" maxlength="80" placeholder="自由填写"></label><label>资料类型<select name="resourceType"><option value="">自动识别</option><option value="web">网页</option><option value="document">技术文档</option><option value="note">精读笔记</option></select></label></div></details><p id="add-progress" class="help"></p><button type="submit" class="primary full">保存</button><p id="add-error" role="alert"></p></form></dialog>
<dialog id="workspace-dialog"><div class="dialog-head"><h2 id="workspace-dialog-title">新建 Workspace</h2><button data-close aria-label="关闭 Workspace 设置">×</button></div><form id="workspace-form"><label>名称<input name="name" required maxlength="100" placeholder="例如 Research Knowledge"></label><label>项目背景<textarea name="context" rows="3" maxlength="12000" placeholder="记录项目背景，后续问答自动复用。"></textarea></label><details class="optional"><summary>回答偏好与常用提问</summary><label>回答要求<textarea name="instructions" rows="2" maxlength="4000" placeholder="例如：优先比较方法、假设和局限，用中文回答。"></textarea></label><label>常用提问（每行一个）<textarea name="prompts" rows="3" maxlength="6000" placeholder="我读过哪些使用 uncertainty 进行 Agent 决策的论文？"></textarea></label></details><button class="primary full">保存 Workspace</button><p id="workspace-error" role="alert"></p></form></dialog>
<dialog id="settings-dialog"><div class="dialog-head"><h2>模型设置</h2><button data-close aria-label="关闭模型设置">×</button></div><form id="settings-form"><label>免费后端<select name="provider" id="provider"></select></label><label>文字模型<select name="model" id="model"></select></label><button type="button" id="reload-models">刷新模型</button><p class="help" id="model-status"></p><details class="optional"><summary>自带 Key</summary><label>个人 API Key<input name="key" type="password" autocomplete="off"></label><label id="account-label" hidden>Cloudflare Account ID<input name="accountId" maxlength="32"></label><p class="help">Key 仅留在当前标签页。Gemini 留空使用现有 PT 后台免费额度。</p></details><p class="help">切换模型不改变资料、索引或历史。调用时，检索片段会发送至所选模型。</p><button class="primary full">保存设置</button></form></dialog>
<dialog id="source-dialog" class="wide"><div class="dialog-head"><h2 id="source-title">资料</h2><button data-close aria-label="关闭资料">×</button></div><div id="source-body"></div></dialog>
<dialog id="confirm-dialog"><div class="dialog-head"><h2>删除这条资料？</h2><button data-close aria-label="关闭删除确认">×</button></div><p>将从资料库删除原始资料和相关归档，无法撤销。</p><div class="row"><button data-close>保留</button><button id="delete-confirm" class="danger">确认删除</button></div></dialog><datalist id="category-options"></datalist><script type="module" src="./app.mjs?v=auto-connect-20261025"></script></body></html>
