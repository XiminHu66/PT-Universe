<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Daily Nexus</title>
  <style>
    :root{
      --bg:#0d0f14;--bg2:#121722;--panel:rgba(22,26,35,.76);--panel2:rgba(30,35,46,.78);
      --text:#f5f7fb;--muted:#98a2b3;--line:rgba(255,255,255,.09);--accent:#7287ff;--accent2:#9c68f2;
      --good:#63d7a5;--warn:#ffc768;--bad:#ff7d86;--shadow:0 18px 50px rgba(0,0,0,.28);--radius:22px;
    }
    :root[data-theme="light"]{
      --bg:#eef2f7;--bg2:#f7f9fc;--panel:rgba(255,255,255,.82);--panel2:rgba(255,255,255,.92);
      --text:#151821;--muted:#697386;--line:rgba(18,24,40,.10);--accent:#5877f4;--accent2:#7e5cef;
      --good:#2ba976;--warn:#c98a16;--bad:#d95761;--shadow:0 18px 45px rgba(48,59,80,.12)
    }
    *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
    body{background:radial-gradient(circle at 10% 0%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 28%),radial-gradient(circle at 95% 10%,color-mix(in srgb,var(--accent2) 11%,transparent),transparent 27%),linear-gradient(155deg,var(--bg),var(--bg2));color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    #themeBg{position:fixed;inset:-5%;z-index:0;pointer-events:none;background-repeat:no-repeat;background-size:cover;background-position:50% 50%;opacity:0;transition:opacity .25s,filter .25s,transform .25s}
    .bgShade{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(135deg,color-mix(in srgb,var(--bg) 28%,transparent),transparent 48%,color-mix(in srgb,var(--bg2) 20%,transparent))}
    button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
    .app{position:relative;z-index:1;height:100dvh;display:grid;grid-template-columns:84px 1fr;gap:14px;padding:14px}
    .glass{background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 96%,white 4%),var(--panel));border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .sidebar{border-radius:26px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:0}
    .logo{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;margin-bottom:8px;background:linear-gradient(145deg,var(--accent),var(--accent2));background-size:cover;background-position:center;background-repeat:no-repeat;box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 22%,transparent);color:white;font-weight:900;letter-spacing:-1px;overflow:hidden}.logo.has-image{color:transparent;text-shadow:none}
    .navbtn{width:56px;height:56px;border:0;border-radius:17px;background:transparent;color:var(--muted);display:grid;place-items:center;position:relative}.navbtn:hover{background:color-mix(in srgb,var(--panel2) 80%,transparent);color:var(--text)}.navbtn.active{background:color-mix(in srgb,var(--accent) 16%,var(--panel2));color:var(--text)}.navbtn span{font-size:11px;margin-top:2px}.navicon{font-size:20px;line-height:1}.spacer{flex:1}
    .shell{min-width:0;min-height:0;display:grid;grid-template-rows:auto 1fr;gap:12px}
    .topbar{
      border-radius:22px;min-height:142px;padding:10px 13px;
      display:grid;grid-template-columns:minmax(470px,38%) minmax(0,62%) 44px;
      gap:12px;align-items:stretch
    }
    .header-clock{
      display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;
      padding:4px 18px 4px 12px;min-width:0;border-right:1px solid var(--line)
    }
    .header-clock-photo{
      position:absolute;right:6px;top:6px;bottom:6px;width:60%;border-radius:16px;
      background-repeat:no-repeat;background-size:cover;background-position:50% 50%;
      opacity:0;pointer-events:none;z-index:0;transition:opacity .18s ease,background-position .08s linear;
      -webkit-mask-image:linear-gradient(to right,transparent 0%,rgba(0,0,0,.62) 24%,#000 58%);
      mask-image:linear-gradient(to right,transparent 0%,rgba(0,0,0,.62) 24%,#000 58%)
    }
    .header-clock-photo.show{opacity:.88}
    .header-clock .time,.header-clock .date,.header-clock .greet{position:relative;z-index:1}
    .header-clock .time{
      font-size:56px;font-weight:890;letter-spacing:-3px;line-height:.9;
      font-variant-numeric:tabular-nums
    }
    .header-clock .date{font-size:13px;color:var(--muted);margin-top:10px;white-space:nowrap;padding-right:42%}
    .header-clock .greet{font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap;padding-right:42%}

    .header-weather{
      min-width:0;display:grid;
      grid-template-columns:365px minmax(300px,1fr);
      grid-template-rows:58px 1fr;
      grid-template-areas:"current metrics" "forecast forecast";
      gap:7px 12px;align-items:stretch;padding:1px 0
    }
    .hw-current{
      grid-area:current;display:grid;grid-template-columns:54px auto minmax(0,1fr);
      align-items:center;gap:11px;min-width:0;padding:0 8px
    }
    .hw-icon{width:50px;height:50px;display:grid;place-items:center;border-radius:15px;background:color-mix(in srgb,var(--accent) 9%,transparent);font-size:46px;line-height:1;text-align:center;filter:drop-shadow(0 4px 8px color-mix(in srgb,var(--text) 12%,transparent))}
    .hw-temp{font-size:45px;font-weight:875;letter-spacing:-2.5px;line-height:.95;white-space:nowrap}
    .hw-copy{min-width:0;padding-left:2px;display:grid;gap:4px}
    .hw-condition{font-size:14px;font-weight:820;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
    .hw-place{font-size:11px;font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px;cursor:pointer;color:var(--text)}
    .hw-place:hover{text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent)}
    .hw-desc{display:flex;align-items:center;gap:5px;min-width:0;font-size:10px;color:var(--muted);line-height:1.2;white-space:nowrap;overflow:hidden}
    .hw-desc #weatherMeta{overflow:hidden;text-overflow:ellipsis}
    .hw-desc #weatherMeta::before{content:"·";margin-right:5px;color:var(--muted)}

    .hw-metrics{
      grid-area:metrics;display:flex;align-items:center;justify-content:flex-end;
      gap:0;min-width:0;padding-right:6px
    }
    .hw-metric{
      min-width:100px;border:0;border-left:1px solid var(--line);
      background:transparent;border-radius:0;padding:3px 14px;text-align:right
    }
    .hw-metric:first-child{border-left:0}
    .hw-metric span{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
    .hw-metric b{display:block;font-size:14px;margin-top:3px;white-space:nowrap}
    .hw-metric.aqi b{font-size:15px}

    .header-forecast{
      grid-area:forecast;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
      gap:7px;align-content:stretch
    }
    .header-day{
      border:1px solid var(--line);border-radius:13px;padding:8px 11px;
      background:color-mix(in srgb,var(--panel2) 62%,transparent);
      display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"day weather icon" "temp temp rain";
      align-items:center;column-gap:6px;min-width:0
    }
    .header-day b{grid-area:day;font-size:12px;margin:0;white-space:nowrap}
    .header-day .dayweather{grid-area:weather;min-width:0;color:var(--muted);font-size:10px;font-weight:650;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .header-day .dayicon{grid-area:icon;font-size:20px;line-height:1;filter:drop-shadow(0 2px 3px color-mix(in srgb,var(--text) 12%,transparent))}
    .header-day .daytemp{grid-area:temp;font-size:12px;color:var(--text);white-space:nowrap;margin-top:4px}
    .header-day .dayrain{grid-area:rain;font-size:10px;color:var(--accent);white-space:nowrap;margin-top:4px}
    .header-actions{display:flex;align-items:center;justify-content:center}
    .calendar-quick{display:none}
    .pillbtn,.iconbtn,.action{border:1px solid var(--line);background:color-mix(in srgb,var(--panel2) 88%,transparent);border-radius:14px}.pillbtn{padding:8px 11px}.iconbtn{width:42px;height:42px}.view{min-height:0;display:none}.view.active{display:block;height:100%}
    .dashboard{height:100%;display:grid;grid-template-columns:1.34fr .96fr .70fr;grid-template-rows:minmax(395px,1.18fr) minmax(270px,.82fr);gap:12px}.card{border-radius:var(--radius);padding:16px;min-width:0;min-height:0;overflow:hidden;position:relative}.cardhead{display:flex;align-items:center;gap:10px;margin-bottom:9px}.cardhead h2{font-size:15px;margin:0}.cardhead .sub{margin-left:auto;color:var(--muted);font-size:12px}.homecalendar{grid-column:1;grid-row:1}.memo{grid-column:2;grid-row:1}.home-links-card{grid-column:3;grid-row:1}.upcomingcard{grid-column:1;grid-row:2}.discover{grid-column:2/span 2;grid-row:2}

    .home-cal-body{height:calc(100% - 33px);display:grid;grid-template-columns:minmax(0,1.34fr) minmax(180px,.66fr);gap:12px}
    .home-cal-month{min-width:0;padding-right:10px;border-right:1px solid var(--line)}
    .home-calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .home-calendar-head b{font-size:16px}
    .home-calendar-head button{border:0;background:transparent;color:var(--muted);width:32px;height:30px;border-radius:9px;font-size:18px}
    .home-calendar-head button:hover{background:var(--panel2);color:var(--text)}
    .home-calendar-weekdays,.home-calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
    .home-calendar-weekdays span{text-align:center;font-size:12px;color:var(--muted);padding:2px 0 4px}
    .home-calendar-grid button{
      height:32px;border:1px solid transparent;background:transparent;border-radius:9px;
      font-size:13px;color:color-mix(in srgb,var(--muted) 58%,transparent);position:relative
    }
    .home-calendar-grid button.in-month{color:var(--text)}
    .home-calendar-grid button:hover{background:var(--panel2)}
    .home-calendar-grid button.today{border-color:color-mix(in srgb,var(--accent) 65%,var(--line));font-weight:850;background:color-mix(in srgb,var(--accent) 8%,transparent)}
    .home-calendar-grid button.has-items{background:color-mix(in srgb,var(--accent) 9%,transparent)}
    .home-calendar-grid button.has-items::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--accent);right:5px;bottom:4px}
    .home-today-panel{min-width:0;display:flex;flex-direction:column}
    .home-today-head{display:flex;align-items:center;gap:7px;margin-bottom:6px}
    .home-today-head b{font-size:16px}
    .home-today-head span{font-size:12px;color:var(--muted);margin-left:auto}
    .home-today-head button{border:0;background:transparent;color:var(--muted);padding:3px 0;font-size:12px}
    .home-today-list{flex:1;min-height:0;overflow:auto;display:grid;align-content:start;gap:6px;padding:2px 1px}
    .home-today-item{
      display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px;align-items:center;
      border:1px solid var(--line);background:color-mix(in srgb,var(--panel2) 55%,transparent);
      border-radius:10px;padding:7px 8px
    }
    .home-today-item input{accent-color:var(--accent);width:15px;height:15px}
    .home-today-item span{font-size:13px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .home-today-item.done span{text-decoration:line-through;opacity:.55}
    .home-today-empty{border:1px dashed var(--line);border-radius:11px;padding:14px 9px;text-align:center;color:var(--muted);font-size:12px;line-height:1.45}
    .home-today-add{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:6px;margin-top:7px;padding-top:7px;border-top:1px solid var(--line)}
    .home-today-add input{height:34px;border:1px solid var(--line);background:transparent;border-radius:10px;padding:0 9px;font-size:12px;min-width:0}
    .home-today-add button{height:34px;border:0;border-radius:10px;background:color-mix(in srgb,var(--accent) 18%,transparent);font-size:16px}


    textarea{width:100%;height:105px;resize:none;border:0;outline:none;background:transparent;line-height:1.55;font-size:14px}.memo{display:flex;flex-direction:column}.memo-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}.memo-foot input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:13px}.miniadd{border:0;background:color-mix(in srgb,var(--accent) 18%,transparent);padding:8px 10px;border-radius:11px}.tasks{margin-top:7px;display:flex;gap:7px;overflow:auto;padding-bottom:2px}.taskchip{white-space:nowrap;border:1px solid var(--line);padding:6px 9px;border-radius:999px;font-size:11px;color:var(--muted);background:var(--panel2)}.taskchip.done{text-decoration:line-through;opacity:.6}
    .memo-empty{margin-top:8px;border:1px dashed var(--line);border-radius:13px;padding:8px 10px;font-size:11px;color:var(--muted);display:none}.memo-empty.show{display:block}
    .memo-countdown{margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
    .memo-countdown-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
    .memo-countdown-head b{font-size:14px}.memo-countdown-head span{font-size:11px;color:var(--muted)}
    .memo-countdown-head button{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:12px;padding:3px 0}
    .memo-countdown-list{display:grid;gap:6px}
    .memo-countdown-row{width:100%;display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:color-mix(in srgb,var(--panel2) 58%,transparent);border-radius:12px;padding:8px 10px;color:var(--text);transition:border-color .16s,background .16s,box-shadow .16s}
    .memo-countdown-row.soon{border-color:color-mix(in srgb,var(--warn) 58%,var(--line));background:color-mix(in srgb,var(--warn) 10%,var(--panel2));box-shadow:inset 3px 0 0 color-mix(in srgb,var(--warn) 85%,transparent)}
    .memo-countdown-row.urgent{border-color:color-mix(in srgb,var(--bad) 62%,var(--line));background:color-mix(in srgb,var(--bad) 11%,var(--panel2));box-shadow:inset 3px 0 0 color-mix(in srgb,var(--bad) 90%,transparent)}
    .memo-countdown-date{font-variant-numeric:tabular-nums;border-right:1px solid var(--line);padding-right:8px}.memo-countdown-date b{display:block;font-size:13px}.memo-countdown-date span{display:block;margin-top:3px;font-size:10px;color:var(--muted)}
    .memo-countdown-copy{min-width:0}.memo-countdown-title{display:block;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.memo-countdown-meta{display:block;font-size:11px;color:var(--muted);margin-top:4px}
    .memo-countdown-due{font-size:11px;font-weight:800;white-space:nowrap;padding:5px 7px;border-radius:8px;background:color-mix(in srgb,var(--accent) 12%,transparent)}.memo-countdown-row.urgent .memo-countdown-due{color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}.memo-countdown-row.soon .memo-countdown-due{color:color-mix(in srgb,var(--warn) 78%,var(--text));background:color-mix(in srgb,var(--warn) 18%,transparent)}
    .memo-countdown-empty{width:100%;border:1px dashed var(--line);background:transparent;border-radius:11px;padding:11px 9px;text-align:center;color:var(--muted);font-size:10px}
    

    .upcoming-toolbar{display:flex;align-items:center;gap:6px;margin:-1px 0 9px;overflow-x:auto;scrollbar-width:none}
    .upcoming-toolbar::-webkit-scrollbar{display:none}
    .upcoming-filter{
      border:1px solid var(--line);background:var(--panel2);color:var(--muted);
      border-radius:999px;padding:6px 10px;font-size:11px;white-space:nowrap
    }
    .upcoming-filter.active{
      background:color-mix(in srgb,var(--accent) 15%,var(--panel2));color:var(--text);
      border-color:color-mix(in srgb,var(--accent) 45%,var(--line))
    }
    .upcomingcard{display:flex;flex-direction:column}
    .upcoming-home-list{display:grid;gap:7px;align-content:start;flex:1;min-height:0;overflow:auto;padding-right:2px}
    .upcoming-row{
      min-width:0;display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;
      gap:9px;align-items:center;border:1px solid var(--line);
      background:color-mix(in srgb,var(--panel2) 56%,transparent);border-radius:13px;padding:8px 9px
    }
    .upcoming-row.pinned{
      background:color-mix(in srgb,var(--accent) 8%,var(--panel2));
      border-color:color-mix(in srgb,var(--accent) 30%,var(--line))
    }
    .up-date{
      height:44px;border-radius:10px;background:var(--panel);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      border:1px solid var(--line);font-variant-numeric:tabular-nums
    }
    .up-date b{font-size:12px;line-height:1}.up-date span{font-size:9px;color:var(--muted);margin-top:4px}
    .up-main{min-width:0}.up-title{
      font-size:13px;font-weight:790;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
    }
    .up-meta{
      display:flex;align-items:center;gap:6px;min-width:0;margin-top:4px;
      font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden
    }
    .up-cat{font-size:9px;padding:2px 5px;border-radius:6px;background:var(--panel);color:var(--soft)}
    .up-source{overflow:hidden;text-overflow:ellipsis}
    .up-badge{
      min-width:43px;text-align:center;border-radius:9px;padding:6px 7px;font-size:10px;font-weight:800;
      background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--text)
    }
    .up-pin{
      width:30px;height:30px;border:0;background:transparent;border-radius:9px;
      color:var(--muted);font-size:17px;padding:0
    }
    .up-pin.active{color:#d59a22;background:color-mix(in srgb,#f6c85f 13%,transparent)}
    .upcoming-empty{
      border:1px dashed var(--line);border-radius:14px;padding:22px 12px;
      text-align:center;color:var(--muted);font-size:12px;line-height:1.55
    }
    .upcoming-foot{
      margin-top:8px;padding-top:8px;border-top:1px solid var(--line);
      display:flex;align-items:center;gap:8px;font-size:10px;color:var(--muted)
    }
    .upcoming-foot button{margin-left:auto;border:0;background:transparent;color:var(--muted);padding:3px}
    .upcoming-status-dot{width:6px;height:6px;border-radius:50%;background:var(--good)}
    .upcoming-status-dot.loading{background:var(--warn)}
    .upcoming-status-dot.bad{background:var(--bad)}

    .upcoming-modal-top{
      display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px
    }
    .upcoming-modal-top select{width:auto;min-width:100px}
    .upcoming-modal-top .spacer{flex:1}
    .upcoming-modal-list{display:grid;gap:8px;max-height:430px;overflow:auto;padding-right:2px}
    .upcoming-modal-item{
      display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:10px;align-items:center;
      border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:10px
    }
    .upcoming-modal-item.pinned{border-color:color-mix(in srgb,var(--accent) 42%,var(--line))}
    .upcoming-modal-copy{min-width:0}.upcoming-modal-copy b{display:block;font-size:13px}
    .upcoming-modal-copy p{margin:4px 0 0;color:var(--muted);font-size:10px;line-height:1.45}
    .upcoming-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
    .upcoming-actions button,.upcoming-actions a{
      border:1px solid var(--line);background:var(--panel);border-radius:9px;
      padding:6px 8px;font-size:10px;text-decoration:none
    }
    .upcoming-actions .starred{color:#d59a22}
    .upcoming-addbox{
      margin-top:12px;padding:12px;border:1px dashed var(--line);border-radius:14px;
      background:color-mix(in srgb,var(--panel2) 66%,transparent)
    }
    .upcoming-addgrid{display:grid;grid-template-columns:1fr 150px 160px;gap:7px;margin-top:8px}
    .upcoming-addgrid .wide{grid-column:1/-1}
    @media(max-width:740px){
      .upcoming-row{grid-template-columns:48px minmax(0,1fr) auto}.up-pin{display:none}
      .upcoming-modal-item{grid-template-columns:52px minmax(0,1fr)}
      .upcoming-actions{grid-column:1/-1;justify-content:flex-start}
      .upcoming-addgrid{grid-template-columns:1fr}
      .upcoming-addgrid .wide{grid-column:auto}
    }
    .discover{display:flex;flex-direction:column}
    .discover-grid{
      flex:1;min-height:0;display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:1fr;
      gap:10px
    }
    .discovery-item{
      border:1px solid var(--line);border-radius:16px;padding:11px 12px;
      background:color-mix(in srgb,var(--panel2) 58%,transparent);
      min-width:0;overflow:hidden;display:flex;flex-direction:column
    }
    .discover-head{display:flex;align-items:center;gap:8px;min-height:28px}
    .discover-icon{
