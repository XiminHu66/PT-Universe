<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#ffffff"><meta name="description" content="自己的菜馆与菜品红黑榜。记住值得再点的菜，也记住踩过的雷。">
 <title>红黑榜 · PT Universe</title><link rel="icon" href="../../icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=20261005-2">
</head>
<body>
 <header class="topbar"><div class="top-inner"><a class="universe" href="../../" aria-label="返回 PT Universe">PT <span>UNIVERSE</span></a><div class="title"><span class="mark" aria-hidden="true">红<span>黑</span></span><h1>红黑榜</h1></div><button id="settings-open" class="quiet">备份与同步</button></div></header>
 <main class="shell">
  <section class="directory" aria-label="我的菜馆">
   <div class="directory-head"><h2>我的菜馆 <span id="restaurant-count">0</span></h2></div>
   <form id="restaurant-quick" class="restaurant-quick"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" maxlength="120" placeholder="输入菜馆名，查找或添加" aria-label="搜索菜馆、菜品或地址" autocomplete="off"></label><button class="primary" id="add-restaurant" type="submit" disabled>添加</button></form>
   <div class="summary" id="summary"></div>
   <div id="restaurant-list" class="restaurant-list"></div>
   <small class="save-state" id="save-state" role="status">记录保存在此设备</small>
  </section>
  <section class="board" id="board" aria-label="菜品红黑榜"></section>
 </main>
 <dialog id="restaurant-dialog" class="sheet"><form id="restaurant-form"><div class="dialog-head"><h2 id="restaurant-form-title">记一家菜馆</h2><button type="button" class="close" data-close aria-label="关闭">×</button></div><label>菜馆名称 <span class="required">必填</span><input name="name" id="restaurant-name" required maxlength="120" placeholder="例如：店名 · Bellevue 分店" autocomplete="organization"></label><label>地址<input name="address" maxlength="500" placeholder="街道、城市等完整地址" autocomplete="street-address"></label><p class="field-help">保存后，点击地址即可打开 Google Maps 导航。</p><label>链接<input name="url" type="text" inputmode="url" maxlength="2000" placeholder="官网、菜单或 Google Maps 链接"></label><label>菜馆备注<textarea name="note" rows="3" maxlength="4000" placeholder="停车、排队、口味偏好……"></textarea></label><p class="form-error" id="restaurant-error" role="alert"></p><div class="dialog-actions"><button type="button" class="quiet" data-close>取消</button><button type="submit" class="primary">保存菜馆</button></div></form></dialog>
 <dialog id="dish-dialog" class="sheet"><form id="dish-form"><div class="dialog-head"><div><small id="dish-restaurant"></small><h2 id="dish-form-title">记一道菜</h2></div><button type="button" class="close" data-close aria-label="关闭">×</button></div><label>菜品名称 <span class="required">必填</span><input id="dish-name" name="name" required maxlength="120" placeholder="记下菜单上的名字"></label><fieldset class="rank-choice"><legend>放在哪个榜？</legend><label class="red-choice"><input type="radio" name="rank" value="red" checked><span><b>红榜</b><small>值得再点</small></span></label><label class="black-choice"><input type="radio" name="rank" value="black"><span><b>黑榜</b><small>下次避开</small></span></label></fieldset><label>评价 / 原因<textarea name="note" rows="4" maxlength="4000" placeholder="哪里好吃，或为什么不推荐？"></textarea></label><label>吃过的日期<input name="date" type="date"></label><p class="form-error" id="dish-error" role="alert"></p><div class="dialog-actions"><button type="button" class="quiet" data-close>取消</button><button type="submit" class="primary">保存菜品</button></div></form></dialog>
 <dialog id="settings-dialog" class="sheet"><div class="settings-body"><div class="dialog-head"><h2>备份与同步</h2><button class="close" data-close aria-label="关闭">×</button></div><section class="settings-section"><h3>手机与电脑共用记录</h3><p>记录自动保存。联网后加密同步；另一台设备输入相同配对码即可连接。配对码请自己保管。</p><label>配对码<textarea id="sync-code" rows="3" spellcheck="false" placeholder="在另一台设备粘贴配对码"></textarea></label><div class="button-row"><button id="sync-copy" class="quiet">复制配对码</button><button id="sync-connect" class="primary">连接设备</button><button id="sync-now" class="quiet">立即同步</button></div><p id="sync-status" class="field-help" role="status"></p></section><section class="settings-section"><h3>完整备份</h3><p>导出所有菜馆和菜品。导入时合并记录，同一条记录保留较新的版本。</p><div class="button-row"><button id="export" class="quiet">导出备份</button><button id="import-open" class="quiet">导入备份</button><input id="import-file" type="file" accept="application/json,.json" hidden></div></section></div></dialog>
 <div class="toast" id="toast" role="status" hidden></div>
 <script type="module" src="app.mjs?v=20261005-2"></script>
</body></html>
