name: Knowledge Garden validation
'on':
  pull_request:
    paths:
    - apps/knowledge-garden/**
    - scripts/knowledge-garden/**
    - .github/workflows/knowledge-garden-check.yml
  push:
    branches:
    - main
    paths:
    - apps/knowledge-garden/**
    - scripts/knowledge-garden/**
    - .github/workflows/knowledge-garden-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - run: |
        node --check apps/knowledge-garden/app.mjs
        node --check apps/knowledge-garden/backend.mjs
        node --check apps/knowledge-garden/site-route.mjs
        node scripts/knowledge-garden/model-test.mjs
        node scripts/knowledge-garden/workspace-test.mjs
        node scripts/knowledge-garden/backend-test.mjs
        node scripts/knowledge-garden/management-graph-test.mjs
        node scripts/knowledge-garden/semantic-test.mjs
        node scripts/knowledge-garden/graph-labels-test.mjs
    timeout-minutes: 15
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
