name: Media Vault validation
on:
  pull_request:
    paths:
      - apps/media-vault/**
      - workers/media-vault-hybrid/**
      - scripts/media-vault/**
      - services/media-engine/**
      - workers/pt-universe-api/**
      - .github/workflows/media-vault-check.yml
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s scripts/media-vault -p 'test_*.py'
      - run: docker build -t media-vault-engine services/media-engine
      - name: Verify runtime tools
        run: docker run --rm --entrypoint sh media-vault-engine -c 'yt-dlp --version && aria2c --version && node --version && test -x /usr/local/bin/novel-adapter'
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test --prefix workers/media-vault-hybrid
      - name: Check closed candidate and evidence consistency
        run: node workers/media-vault-hybrid/candidate-check.mjs
      - run: node --check workers/media-vault-hybrid/src/index.js
      - run: node --check workers/media-vault-hybrid/src/transport.js
      - run: node --check workers/media-vault-hybrid/src/relay.js
      - run: npm ci --prefix workers/pt-universe-api
      - name: Actual local workerd relay and connection lifecycle
        run: npm run test:transport-runtime --prefix workers/media-vault-hybrid
      - run: npx --prefix workers/pt-universe-api wrangler deploy --config workers/media-vault-hybrid/wrangler.jsonc --dry-run --outdir /tmp/pt-media-hybrid-dryrun
      - run: node scripts/media-vault/frontend-test.cjs
      - run: npm run test:media --prefix workers/pt-universe-api
      - run: npm run check --prefix workers/pt-universe-api
      - run: npm run types --prefix workers/pt-universe-api -- --check
      - run: npx --prefix workers/pt-universe-api wrangler deploy --config workers/pt-universe-api/wrangler.jsonc --dry-run
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Browser interaction and responsive layout
        run: node scripts/media-vault/browser-test.cjs
      - name: Validate generated EPUB structure
        run: |
          pip install Pillow
          python scripts/media-vault/validate-epub.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-vault-browser-review
          path: test-results/media-vault
          retention-days: 7
