name: Refresh Research Tools
'on':
  schedule:
  - cron: 35 0,4,8,12,16,20 * * *
    timezone: America/Los_Angeles
  - cron: 35 9 * * *
    timezone: America/Los_Angeles
  push:
    branches:
    - main
    paths:
    - scripts/labs/**
    - apps/eastside-weekend/**
    - apps/daily-nexus/data/upcoming-sources.json
  workflow_dispatch:
    inputs:
      target:
        description: Explicit manual dataset (financials has no automatic collection)
        type: choice
        default: all
        options: [all, financials, events, upcoming]
permissions:
  contents: read
concurrency:
  group: pt-universe-research-refresh
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
      collect: ${{ steps.check.outputs.collect }}
      matrix: ${{ steps.check.outputs.matrix }}
      force: ${{ steps.check.outputs.force }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - id: check
      env:
        EVENT: ${{ github.event_name }}
        MANUAL_TARGET: ${{ inputs.target }}
      run: python scripts/labs/schedule.py
  collect:
    needs: gate
    if: needs.gate.outputs.collect == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install -r scripts/labs/requirements.txt
    - run: python -m unittest discover -s scripts/labs -p 'test_*.py'
    - name: Collect and retry failed sources
      env:
        TARGET: ${{ matrix.target }}
        FORCE: ${{ needs.gate.outputs.force }}
      run: |
        if [ "$FORCE" = "yes" ]; then
          python scripts/labs/refresh.py --target "$TARGET" --force
        else
          python scripts/labs/refresh.py --target "$TARGET"
        fi
    - name: Stage only this dataset
      if: always()
      env:
        TARGET: ${{ matrix.target }}
      run: |
        python - <<'PY'
        import os, shutil, sys
        from pathlib import Path
        sys.path.insert(0, 'scripts/labs')
        from refresh import data_path, ROOT
        source = data_path(os.environ['TARGET'])
        if source.exists():
            target = Path('collected') / source.relative_to(ROOT)
            target.parent.mkdir(parents=True, exist_ok=True)
            shutil.copy2(source, target)
        PY
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: labs-${{ matrix.target }}
        path: collected/
        if-no-files-found: warn
        retention-days: 3
  publish:
    needs:
    - gate
    - collect
    if: always() && needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - uses: actions/download-artifact@v4
      if: needs.gate.outputs.collect == 'yes'
      with:
        pattern: labs-*
        merge-multiple: true
        path: .
    - name: Skip publication when the snapshot did not change
      id: snapshot_change
      run: if git diff --quiet -- apps; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT";
        fi
    - name: Save independent snapshots and source health
      run: |
        git config user.name "pt-universe-labs-bot"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add apps/thesis-lab/data apps/eastside-weekend/data apps/daily-nexus/data/upcoming-events.json
        if ! git diff --cached --quiet; then
          git commit -m "data(labs): publish independent snapshots and source health"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
        fi
    outputs:
      changed: ${{ steps.snapshot_change.outputs.changed }}
  report:
    needs:
    - gate
    - collect
    - publish
    if: always() && needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    steps:
    - name: Report failures after publishing available data
      env:
        COLLECT: ${{ needs.collect.result }}
        PUBLISH: ${{ needs.publish.result }}
      run: |
        echo "Collection: $COLLECT; publication: $PUBLISH. Pages is handled by the shared publication workflow." >> "$GITHUB_STEP_SUMMARY"
        if [[ "$COLLECT" == failure || "$COLLECT" == cancelled || "$PUBLISH" != success ]]; then exit 1; fi
    timeout-minutes: 15
