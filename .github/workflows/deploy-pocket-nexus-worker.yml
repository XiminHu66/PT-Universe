name: Deploy Pocket Nexus Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - workers/pocket-nexus-api/**
      - .github/workflows/deploy-pocket-nexus-worker.yml

permissions:
  contents: read

concurrency:
  group: pocket-nexus-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/pocket-nexus-api
    steps:
      - name: Check out PT Universe
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
      - name: Validate Worker
        run: |
          npm run check
          npx wrangler deploy --dry-run
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Verify public Pocket API
        working-directory: .
        run: |
          set -euo pipefail
          base='https://pocket-nexus-api.summer07-nanjolno.workers.dev'
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$base/health" | tee /tmp/health.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$base/api/stocks" | tee /tmp/stocks.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$base/api/news" | tee /tmp/news.json
          python - <<'PY'
          import json
          for name in ('health','stocks','news'):
              data=json.load(open(f'/tmp/{name}.json',encoding='utf-8'))
              assert data.get('ok') is True, (name,data)
          assert len(json.load(open('/tmp/stocks.json'))['items']) >= 4
          assert len(json.load(open('/tmp/news.json'))['items']) >= 1
          print('Pocket Nexus API verified')
          PY
