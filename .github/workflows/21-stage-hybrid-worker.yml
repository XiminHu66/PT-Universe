name: "21 - Stage Media Vault hybrid Worker (manual; streaming OFF)"
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pt-media-hybrid-cloud-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Check out reviewed staging branch (not production webpage)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/media-vault-vps-engine-ready
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check required secrets exist without printing them
        env:
          CF_API: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER: ${{ secrets.MEDIA_HYBRID_OWNER_TOKEN }}
          AGENT: ${{ secrets.MEDIA_HYBRID_AGENT_TOKEN }}
          D1_API: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          for key in CF_API CF_ACCOUNT OWNER AGENT D1_API; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Required GitHub Actions secret missing. See the Media Vault hybrid setup guide."
              exit 1
            fi
          done
          owner_ok=false; agent_ok=false; distinct=false
          [[ "${#OWNER}" -ge 32 ]] && owner_ok=true
          [[ "${#AGENT}" -ge 32 ]] && agent_ok=true
          [[ "$OWNER" != "$AGENT" ]] && distinct=true
          echo "OWNER at least 32 chars: $owner_ok"
          echo "AGENT at least 32 chars: $agent_ok"
          echo "OWNER differs from AGENT: $distinct"
          if [[ "$owner_ok" != true || "$agent_ok" != true || "$distinct" != true ]]; then
            echo "::error::Secret validation failed; no Cloudflare or D1 changes made."
            exit 1
          fi
          echo "Secret presence and separation: PASS (values not logged)."
      - name: Install reviewed Wrangler and test suite
        run: |
          npm ci --prefix workers/pt-universe-api
          npm test --prefix workers/media-vault-hybrid
          npx --prefix workers/pt-universe-api wrangler deploy --config workers/media-vault-hybrid/wrangler.jsonc --dry-run --outdir /tmp/pt-mv-hybrid-stage
      - name: Apply only additive Media Vault D1 metadata tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Read-only D1 query permission preflight"
          npx --prefix workers/pt-universe-api wrangler d1 execute pt-universe-db --config workers/media-vault-hybrid/wrangler.jsonc --remote --command "SELECT 1 AS ok" --yes
          echo "Apply additive Media Vault tables via D1 query API (not bulk-import endpoint)"
          SQL="$(sed '/^[[:space:]]*--/d' workers/media-vault-hybrid/schema.sql | tr '\n' ' ')"
          [[ "$SQL" == *"CREATE TABLE IF NOT EXISTS mv_hybrid_jobs"* ]] || exit 1
          npx --prefix workers/pt-universe-api wrangler d1 execute pt-universe-db --config workers/media-vault-hybrid/wrangler.jsonc --remote --command "$SQL" --yes
      - name: Deploy isolated workers.dev hybrid control plane with streaming disabled
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --prefix workers/pt-universe-api wrangler deploy --config workers/media-vault-hybrid/wrangler.jsonc
      - name: Privately install distinct Worker owner and agent secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER: ${{ secrets.MEDIA_HYBRID_OWNER_TOKEN }}
          AGENT: ${{ secrets.MEDIA_HYBRID_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$OWNER" | npx --prefix workers/pt-universe-api wrangler secret put MEDIA_OWNER_TOKEN --config workers/media-vault-hybrid/wrangler.jsonc
          printf '%s' "$AGENT" | npx --prefix workers/pt-universe-api wrangler secret put MEDIA_AGENT_TOKEN --config workers/media-vault-hybrid/wrangler.jsonc
      - name: Prove authentication and that streaming is OFF
        env:
          OWNER: ${{ secrets.MEDIA_HYBRID_OWNER_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const url='https://pt-media-hybrid.summer07-nanjolno.workers.dev';
          const owner=process.env.OWNER;
          const h={Authorization:'Bearer '+owner,Origin:'https://ximinhu66.github.io'};
          let r;
          for(let attempt=1;attempt<=7;attempt++){
            r=await fetch(url+'/health',{signal:AbortSignal.timeout(12000)});
            console.log('anonymous health HTTP status:',r.status,'attempt',attempt);
            if(r.status===401)break;
            if(r.status===200)throw Error('SECURITY: anonymous health unexpectedly accessible');
            if(attempt===7)throw Error('Anonymous endpoint never returned 401 (last HTTP '+r.status+')');
            await new Promise(resolve=>setTimeout(resolve,4000));
          }
          r=await fetch(url+'/health',{headers:h,signal:AbortSignal.timeout(12000)});
          const data=await r.json();
          if(!r.ok||!data.ok||data.streaming!=='not-live')throw Error('Hybrid staging health did not verify streaming OFF');
          r=await fetch(url+'/quota',{headers:h,signal:AbortSignal.timeout(12000)});
          const quota=await r.json();
          if(!r.ok||quota.tracking!=='not_active')throw Error('Staging quota must remain inactive');
          console.log('PASS: separate workers.dev staging control plane live, protected, streaming OFF.');
          JS
