name: Refresh public investment disclosures
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: investment-public-disclosures
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python scripts/investment/refresh.py
    - name: Skip publication when the snapshot did not change
      id: snapshot_change
      run: if git diff --quiet -- apps; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT";
        fi
    - name: Save public disclosures only
      run: |
        git config user.name "pt-universe-investment-bot"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add apps/investment-desk/data/public-trades.json
        if ! git diff --cached --quiet; then
          git commit -m "data(investment): refresh public disclosure evidence"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
        fi
    outputs:
      changed: ${{ steps.snapshot_change.outputs.changed }}
