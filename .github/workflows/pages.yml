name: Deploy PT Universe
'on':
  push:
    branches:
    - main
    paths:
    - apps/**
    - assets/**
    - "*.html"
    - "*.js"
    - "*.css"
    - scripts/build-pages.py
    - .github/workflows/pages.yml
  workflow_dispatch: null
  workflow_run:
    workflows:
    - Refresh QF data (paused)
    - Refresh 3C Scout data
    - Refresh public investment disclosures
    - Refresh Tsugi reading/music (08:30 conditional fallback)
    - Refresh Research Tools
    - Refresh Stock data
    - Refresh Media Vault
    - Refresh Tsugi games
    types:
    - completed
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pt-universe-pages-v2
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - name: Skip an already published source revision
      id: publication
      run: |
        python - <<'PY'
        import json,os,subprocess,time,urllib.request
        sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
        deployed=''
        try:
            url='https://ximinhu66.github.io/PT-Universe/deployment.json?v='+str(time.time_ns())
            with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=15) as r:deployed=json.load(r).get('sourceCommit','')
        except Exception:pass
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('deploy='+str(sha!=deployed).lower()+'\nsource='+sha+'\n')
        print('Current source',sha,'published',deployed,'deploy',sha!=deployed)
        PY
    - name: Read the full shared recipe source
      id: recipes
      continue-on-error: true
      uses: actions/checkout@v4
      with:
        repository: Anduin2017/HowToCook
        ref: master
        path: .recipe-source
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /dishes/**/*.md
          /LICENSE
      if: steps.publication.outputs.deploy == 'true' && (success()) && github.event_name != 'workflow_run'
    - name: Refresh shared recipe snapshot
      if: steps.publication.outputs.deploy == 'true' && (steps.recipes.outcome == 'success')
      continue-on-error: true
      run: python scripts/decision/sync-recipes.py .recipe-source
    - name: Remove temporary recipe checkout
      if: steps.publication.outputs.deploy == 'true' && (always())
      run: rm -rf .recipe-source
    - uses: actions/configure-pages@v5
      with:
        enablement: true
      if: steps.publication.outputs.deploy == 'true' && (success())
    - name: Prepare bounded frontend distribution
      run: python scripts/build-pages.py
      if: steps.publication.outputs.deploy == 'true' && (success())
    - uses: actions/upload-pages-artifact@v3
      with:
        name: pt-universe-pages-${{ github.run_attempt }}
        path: _site
        retention-days: 1
      if: steps.publication.outputs.deploy == 'true' && (success())
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      with:
        artifact_name: pt-universe-pages-${{ github.run_attempt }}
      if: steps.publication.outputs.deploy == 'true' && (success())
    - name: Verify the deployed source revision
      if: steps.publication.outputs.deploy == 'true'
      env:
        EXPECTED_SOURCE: ${{ steps.publication.outputs.source }}
      run: |
        python - <<'PY'
        import json,os,time,urllib.request
        for attempt in range(12):
            try:
                url='https://ximinhu66.github.io/PT-Universe/deployment.json?v='+str(time.time_ns())
                with urllib.request.urlopen(url,timeout=20) as r:d=json.load(r)
                if d.get('sourceCommit')==os.environ['EXPECTED_SOURCE']:
                    print('PASS: served Pages revision',d['sourceCommit']);break
            except Exception:pass
            if attempt==11:raise SystemExit('Published Pages revision was not observed')
            time.sleep(3)
        PY
    timeout-minutes: 15
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name
      == github.repository && github.event.workflow_run.event != 'pull_request')
