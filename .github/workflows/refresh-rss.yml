name: Refresh RSS Orbit data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/rss-dashboard/config/**
      - apps/rss-dashboard/scripts/**
      - apps/rss-dashboard/requirements.txt
      - .github/workflows/refresh-rss.yml
  schedule:
    # GitHub cron is UTC-only. These paired probes cover a true four-hour cadence
    # anchored at 08:00 Pacific Time in both PST and PDT; the gate skips extras.
    - cron: "7 0,3,4,7,8,11,12,15,16,19,20,23 * * *"

permissions:
  contents: write

concurrency:
  group: pt-universe-rss-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      scrape: ${{ steps.mode.outputs.scrape }}
    steps:
      - name: Check out PT Universe
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this probe should refresh
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "scrape=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LOCAL_HOUR="$(TZ=America/Los_Angeles date +%H)"
          case "$LOCAL_HOUR" in
            00|04|08|12|16|20) echo "scrape=true" >> "$GITHUB_OUTPUT" ;;
            *)           echo "scrape=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Set up Python
        if: steps.mode.outputs.scrape == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/rss-dashboard/requirements.txt

      - name: Install feed dependencies
        if: steps.mode.outputs.scrape == 'true'
        run: python -m pip install -r apps/rss-dashboard/requirements.txt

      - name: Refresh RSS cache
        if: steps.mode.outputs.scrape == 'true'
        working-directory: apps/rss-dashboard
        run: python scripts/fetch_feeds.py

      - name: Commit refreshed RSS data
        if: steps.mode.outputs.scrape == 'true'
        run: |
          git config user.name "pt-universe-rss-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/rss-dashboard/data/feed.json
          if git diff --cached --quiet; then
            echo "No RSS data changes"
          else
            git commit -m "data(rss): refresh feeds"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: refresh
    if: needs.refresh.outputs.scrape == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy the latest PT Universe
        id: deployment
        uses: actions/deploy-pages@v4
