name: Refresh RSS Orbit data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/rss-dashboard/config/**
      - apps/rss-dashboard/scripts/**
      - apps/rss-dashboard/requirements.txt
      - .github/workflows/refresh-rss.yml
  schedule:
    # Staggered from the other PT Universe data jobs.
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: pt-universe-rss-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out PT Universe
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/rss-dashboard/requirements.txt

      - name: Install feed dependencies
        run: python -m pip install -r apps/rss-dashboard/requirements.txt

      - name: Refresh RSS cache
        working-directory: apps/rss-dashboard
        run: python scripts/fetch_feeds.py

      - name: Commit refreshed RSS data
        run: |
          git config user.name "pt-universe-rss-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/rss-dashboard/data/feed.json
          if git diff --cached --quiet; then
            echo "No RSS data changes"
          else
            git commit -m "data(rss): refresh feeds"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy the latest PT Universe
        id: deployment
        uses: actions/deploy-pages@v4
