name: Refresh Tsugi games

on:
  workflow_dispatch:
  schedule:
    # Daily at 08:00 Pacific; GitHub applies PST/PDT automatically.
    - cron: "0 8 * * *"
      timezone: "America/Los_Angeles"
    # Retry only when the morning snapshot is still missing.
    - cron: "30 8 * * *"
      timezone: "America/Los_Angeles"

permissions:
  contents: write

concurrency:
  group: pt-universe-tsugi-games
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out PT Universe
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Pacific schedule and existing fresh game snapshot
        id: gate
        shell: bash
        env:
          REFRESH_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          now=datetime.now(timezone.utc).astimezone(ZoneInfo("America/Los_Angeles"))
          if os.environ["REFRESH_EVENT"]=="schedule" and not(now.hour==8 or now.hour==9 and now.minute<30):
              print("refresh=false\nreason=late_schedule")
              raise SystemExit()
          path=Path("apps/tsugi-checker/data/game-releases.json")
          try:
              data=json.loads(path.read_text())
              generated=datetime.fromisoformat(data["generated_at"].replace("Z","+00:00")).astimezone(ZoneInfo("America/Los_Angeles"))
              fresh=generated.date()==now.date() and generated.hour>=8 and sum(len(data.get("items",{}).get(k,[])) for k in ("pc","mobile","console"))>0
          except Exception:
              fresh=False
          should_refresh=os.environ["REFRESH_EVENT"]!="schedule" or not fresh
          print("refresh="+str(should_refresh).lower())
          print("reason="+("fresh_today" if not should_refresh else "scheduled_or_manual"))
          PY
      - name: Set up Python
        if: steps.gate.outputs.refresh == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/tsugi-checker/requirements.txt

      - name: Install game scraper dependencies
        if: steps.gate.outputs.refresh == 'true'
        run: |
          python -m pip install -r apps/tsugi-checker/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Refresh Tsugi game data
        if: steps.gate.outputs.refresh == 'true'
        working-directory: apps/tsugi-checker
        run: python scraper/run_games.py

      - name: Validate game snapshot
        if: steps.gate.outputs.refresh == 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone

          path = "apps/tsugi-checker/data/game-releases.json"
          data = json.load(open(path, encoding="utf-8"))
          generated = datetime.fromisoformat(data["generated_at"].replace("Z", "+00:00"))
          if generated < datetime.now(timezone.utc) - timedelta(hours=2):
              raise SystemExit("game snapshot was not generated by this run")
          counts = {name: len(rows or []) for name, rows in data.get("items", {}).items()}
          if sum(counts.values()) == 0:
              raise SystemExit("game snapshot is empty")
          print({"generated_at": data["generated_at"], "counts": counts})
          PY

      - name: Stamp game refresh origin
        if: steps.gate.outputs.refresh == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('apps/tsugi-checker/data/game-releases.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['refresh_source']='github:08:00-games' if '${{ github.event_name }}'=='schedule' else 'github:manual-or-push'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit refreshed Tsugi game data
        if: steps.gate.outputs.refresh == 'true'
        run: |
          git config user.name "pt-universe-tsugi-games-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/tsugi-checker/data/game-releases.json \
            apps/tsugi-checker/data/game-state.json
          if git diff --cached --quiet; then
            echo "No Tsugi game data changes"
          else
            git commit -m "data(tsugi-games): daily refresh"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi

      - name: Ask Cloudflare to import the new snapshot
        if: steps.gate.outputs.refresh == 'true'
        shell: bash
        run: |
          http_code=$(curl --silent --show-error --retry 3 --retry-all-errors \
            --output /tmp/ptu-game-sync.json --write-out "%{http_code}" \
            --request POST \
            "https://pt-universe-api.summer07-nanjolno.workers.dev/api/refresh/games")
          cat /tmp/ptu-game-sync.json
          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "Cloudflare import request returned HTTP $http_code; Pages still carries the new snapshot."
          fi

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy the latest PT Universe
        id: deployment
        uses: actions/deploy-pages@v4
