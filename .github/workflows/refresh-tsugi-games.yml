name: Refresh Tsugi games
'on':
  workflow_dispatch: null
  push:
    branches:
    - main
    paths:
    - apps/tsugi-checker/config/content.json
    - apps/tsugi-checker/scraper/games.py
    - apps/tsugi-checker/scraper/run_games.py
    - apps/tsugi-checker/scraper/steam_pc.py
  schedule:
  - cron: 0 8 * * *
    timezone: America/Los_Angeles
  - cron: 30 8 * * *
    timezone: America/Los_Angeles
permissions:
  contents: write
concurrency:
  group: pt-universe-tsugi-games
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Check out PT Universe
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Check Pacific schedule and existing fresh game snapshot
      id: gate
      shell: bash
      env:
        REFRESH_EVENT: ${{ github.event_name }}
      run: python scripts/tsugi/refresh_policy.py
    - name: Set up Python
      if: steps.gate.outputs.refresh == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: apps/tsugi-checker/requirements.txt
    - name: Install game scraper dependencies
      if: steps.gate.outputs.refresh == 'true'
      run: |
        python -m pip install -r apps/tsugi-checker/requirements.txt
        python -m playwright install --with-deps chromium
    - name: Check TapTap calendar parsing
      if: steps.gate.outputs.refresh == 'true'
      run: python scripts/tsugi/test_game_sources.py
    - name: Refresh Tsugi game data
      if: steps.gate.outputs.refresh == 'true'
      working-directory: apps/tsugi-checker
      run: python scraper/run_games.py
    - name: Validate game snapshot
      if: steps.gate.outputs.refresh == 'true'
      run: |
        python - <<'PY'
        import json
        from datetime import datetime, timedelta, timezone

        path = "apps/tsugi-checker/data/game-releases.json"
        data = json.load(open(path, encoding="utf-8"))
        generated = datetime.fromisoformat(data["generated_at"].replace("Z", "+00:00"))
        if generated < datetime.now(timezone.utc) - timedelta(hours=2):
            raise SystemExit("game snapshot was not generated by this run")
        counts = {name: len(rows or []) for name, rows in data.get("items", {}).items()}
        if sum(counts.values()) == 0:
            raise SystemExit("game snapshot is empty")
        print({"generated_at": data["generated_at"], "counts": counts, "failed_sources": {k:v for k,v in data.get("sources",{}).items() if not v.get("ok") or v.get("fallback")}})
        PY
    - name: Stamp game refresh origin
      if: steps.gate.outputs.refresh == 'true'
      run: |
        python - <<'PY'
        import json
        from pathlib import Path
        p=Path('apps/tsugi-checker/data/game-releases.json')
        d=json.loads(p.read_text(encoding='utf-8'))
        d['refresh_source']='github:08:00-games' if '${{ github.event_name }}'=='schedule' else 'github:manual-or-push'
        p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
        PY
    - name: Skip publication when the snapshot did not change
      id: snapshot_change
      run: if git diff --quiet -- apps; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT";
        fi
      if: steps.gate.outputs.refresh == 'true'
    - name: Commit refreshed Tsugi game data
      if: steps.gate.outputs.refresh == 'true'
      run: |
        git config user.name "pt-universe-tsugi-games-bot"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -- \
          apps/tsugi-checker/data/game-releases.json \
          apps/tsugi-checker/data/game-state.json
        if git diff --cached --quiet; then
          echo "No Tsugi game data changes"
        else
          git commit -m "data(tsugi-games): daily refresh"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
        fi
    - name: Ask Cloudflare to import the new snapshot
      if: steps.gate.outputs.refresh == 'true'
      shell: bash
      run: python scripts/tsugi/verify_games.py
    - name: Require complete game source health after publishing successful data
      if: steps.gate.outputs.refresh == 'true'
      run: |
        python - <<'PY'
        import json
        data=json.load(open('apps/tsugi-checker/data/game-releases.json',encoding='utf-8'))
        failed={k:v.get('error','source failed') for k,v in data.get('sources',{}).items() if not v.get('ok') or v.get('fallback')}
        if failed:raise SystemExit('Partial game refresh; successful data was preserved: '+json.dumps(failed,ensure_ascii=False))
        print('All configured game sources passed')
        PY
    outputs:
      changed: ${{ steps.snapshot_change.outputs.changed }}
