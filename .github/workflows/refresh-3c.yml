name: Refresh 3C Scout data
'on':
  workflow_dispatch: null
  push:
    branches:
    - main
    paths:
    - apps/3c-scout/scripts/**
    - apps/3c-scout/tests/**
    - .github/workflows/refresh-3c.yml
  schedule:
  - cron: 15 15 * * *
permissions:
  contents: write
concurrency:
  group: pt-universe-3c-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Check out PT Universe
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Test feed parser
      working-directory: apps/3c-scout
      run: python -m unittest discover -s tests -v
    - name: Fetch product feeds
      working-directory: apps/3c-scout
      run: python scripts/fetch_products.py
    - name: Skip publication when the snapshot did not change
      id: snapshot_change
      run: if git diff --quiet -- apps; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT";
        fi
    - name: Commit refreshed 3C data to PT Universe
      run: |
        git config user.name "pt-universe-3c-bot"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -- apps/3c-scout/data/products.json
        if git diff --cached --quiet; then
          echo "No 3C data changes"
        else
          git commit -m "data(3c): refresh product feed"
          git pull --rebase origin main
          git push origin HEAD:main
        fi
    outputs:
      changed: ${{ steps.snapshot_change.outputs.changed }}
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - uses: actions/configure-pages@v5
      with:
        enablement: true
    - name: Prepare bounded frontend distribution
      run: python scripts/build-pages.py
    - uses: actions/upload-pages-artifact@v3
      with:
        path: _site
        retention-days: 1
    - name: Deploy the latest PT Universe
      id: deployment
      uses: actions/deploy-pages@v4
    timeout-minutes: 15
    if: (success()) && needs.refresh.outputs.changed == 'true'
