name: Refresh Tsugi data (verified daily fallback)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/tsugi-checker/scraper/**"
      - "apps/tsugi-checker/config/content.json"
  schedule:
    # Verified daily fallback: 10:35 PST / 11:35 PDT.
    # Cloudflare remains the primary in-app/manual refresh path; this run keeps
    # the GitHub Pages snapshot independently fresh once per day.
    - cron: "35 18 * * *"

permissions:
  contents: write

concurrency:
  group: pt-universe-tsugi-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out PT Universe
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Explain refresh mode
        run: |
          echo "Running verified Tsugi scrape."
          echo "event=${{ github.event_name }}"
          echo "Cloudflare generated_at is intentionally not used as a reason to skip this daily fallback."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/tsugi-checker/requirements.txt

      - name: Install scraper dependencies
        run: |
          python -m pip install -r apps/tsugi-checker/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Refresh reading and music feeds
        working-directory: apps/tsugi-checker
        run: |
          python scraper/main.py --skip-games
          python scraper/site_dates.py

      - name: Validate refreshed snapshot
        working-directory: apps/tsugi-checker
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          site = json.loads(Path('data/site-updates.json').read_text(encoding='utf-8'))
          music = json.loads(Path('data/music.json').read_text(encoding='utf-8'))
          rows = site.get('items') or []
          songs = (music.get('recent_chart') or []) + (music.get('weekly_chart') or [])
          if len(rows) < 30:
              raise SystemExit(f'site snapshot unexpectedly small: {len(rows)}')
          if len(songs) < 20:
              raise SystemExit(f'music snapshot unexpectedly small: {len(songs)}')
          generated = site.get('generated_at')
          if not generated:
              raise SystemExit('site snapshot missing generated_at')
          age = datetime.now(timezone.utc) - datetime.fromisoformat(generated.replace('Z', '+00:00'))
          if age.total_seconds() > 3600:
              raise SystemExit(f'site snapshot was not regenerated by this run: {generated}')
          print(f'validated site_rows={len(rows)} songs={len(songs)} generated_at={generated}')
          PY

      - name: Commit refreshed Tsugi data to PT Universe
        run: |
          git config user.name "pt-universe-tsugi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/tsugi-checker/data/feed.json \
            apps/tsugi-checker/data/feed.xml \
            apps/tsugi-checker/data/state.json \
            apps/tsugi-checker/data/site-updates.json \
            apps/tsugi-checker/data/music.json
          if git diff --cached --quiet; then
            echo "No Tsugi data changes"
          else
            git commit -m "data(tsugi): refresh feeds"
            # Scheduled/rerun jobs may start from an older branch snapshot.
            # During rebase, prefer this run's freshly generated data on conflicts.
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy the latest PT Universe
        id: deployment
        uses: actions/deploy-pages@v4
