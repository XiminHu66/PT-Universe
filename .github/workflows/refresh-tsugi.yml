name: Refresh Tsugi data (8am verified fallback)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/tsugi-checker/scraper/**"
      - "apps/tsugi-checker/config/content.json"
      - ".github/workflows/refresh-tsugi.yml"
  schedule:
    # Primary daily refresh at 08:00 Pacific time.
    - cron: "0 8 * * *"
      timezone: "America/Los_Angeles"
    # Independent retry. It exits quickly when the 08:00 run already produced
    # a fresh snapshot, but protects Daily Nexus from a delayed/dropped cron.
    - cron: "30 8 * * *"
      timezone: "America/Los_Angeles"

permissions:
  contents: write

concurrency:
  group: pt-universe-tsugi-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out PT Universe
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to refresh sources
        id: refresh
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "push" ]]; then
            echo "scrape=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual_or_source_change" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(timezone.utc).astimezone(ZoneInfo("America/Los_Angeles"))
          path = Path("apps/tsugi-checker/data/site-updates.json")
          try:
              generated = json.loads(path.read_text(encoding="utf-8")).get("generated_at")
              refreshed = datetime.fromisoformat(generated.replace("Z", "+00:00")).astimezone(ZoneInfo("America/Los_Angeles"))
          except Exception:
              refreshed = None
          fresh = bool(refreshed and refreshed.date() == now.date() and refreshed.hour >= 8)
          print(f"scrape={'false' if fresh else 'true'}")
          print(f"reason={'already_refreshed_after_08_today' if fresh else 'daily_08_refresh_needed'}")
          PY

      - name: Explain refresh mode
        run: |
          echo "scrape=${{ steps.refresh.outputs.scrape }}"
          echo "reason=${{ steps.refresh.outputs.reason }}"
          echo "event=${{ github.event_name }}"

      - name: Set up Python
        if: steps.refresh.outputs.scrape == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/tsugi-checker/requirements.txt

      - name: Install scraper dependencies
        if: steps.refresh.outputs.scrape == 'true'
        run: |
          python -m pip install -r apps/tsugi-checker/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Refresh reading and music feeds
        if: steps.refresh.outputs.scrape == 'true'
        working-directory: apps/tsugi-checker
        run: |
          python scraper/main.py --skip-games
          python scraper/site_dates.py

      - name: Validate refreshed snapshot
        if: steps.refresh.outputs.scrape == 'true'
        working-directory: apps/tsugi-checker
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          site = json.loads(Path('data/site-updates.json').read_text(encoding='utf-8'))
          music = json.loads(Path('data/music.json').read_text(encoding='utf-8'))
          rows = site.get('items') or []
          songs = (music.get('recent_chart') or []) + (music.get('weekly_chart') or [])
          if len(rows) < 30:
              raise SystemExit(f'site snapshot unexpectedly small: {len(rows)}')
          if len(songs) < 20:
              raise SystemExit(f'music snapshot unexpectedly small: {len(songs)}')
          generated = site.get('generated_at')
          if not generated:
              raise SystemExit('site snapshot missing generated_at')
          age = datetime.now(timezone.utc) - datetime.fromisoformat(generated.replace('Z', '+00:00'))
          if age.total_seconds() > 3600:
              raise SystemExit(f'site snapshot was not regenerated by this run: {generated}')
          print(f'validated site_rows={len(rows)} songs={len(songs)} generated_at={generated}')
          PY

      - name: Commit refreshed Tsugi data to PT Universe
        if: steps.refresh.outputs.scrape == 'true'
        run: |
          git config user.name "pt-universe-tsugi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/tsugi-checker/data/feed.json \
            apps/tsugi-checker/data/feed.xml \
            apps/tsugi-checker/data/state.json \
            apps/tsugi-checker/data/site-updates.json \
            apps/tsugi-checker/data/music.json
          if git diff --cached --quiet; then
            echo "No Tsugi data changes"
          else
            git commit -m "data(tsugi): refresh feeds"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy the latest PT Universe
        id: deployment
        uses: actions/deploy-pages@v4
