name: Refresh Tsugi data (Cloudflare watchdog fallback)

on:
  workflow_dispatch:
  schedule:
    # Emergency watchdog: 10:35 PST / 11:35 PDT, after Cloudflare's 09:17 run.
    - cron: "35 18 * * *"

# Daily and in-app refreshes now run in workers/pt-universe-api on Cloudflare.
# The scheduled job is only a probe; the heavy scraper runs when Cloudflare data is stale.

permissions:
  contents: write

concurrency:
  group: pt-universe-tsugi-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out PT Universe
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the scheduled probe should refresh
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "scrape=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual_or_source_change" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if curl --fail --silent --show-error --max-time 20 \
            "https://pt-universe-api.summer07-nanjolno.workers.dev/api/status?watchdog=${{ github.run_id }}" \
            > /tmp/pt-universe-status.json; then
            if python - <<'PY'
          import json, sys
          from datetime import datetime, timedelta, timezone

          try:
              data = json.load(open("/tmp/pt-universe-status.json", encoding="utf-8"))
              files = {row["name"]: row for row in data.get("files", [])}
              cutoff = datetime.now(timezone.utc) - timedelta(hours=20)
              required = ("site-updates.json", "music.json", "acg-news.json")
              refreshed = []
              for name in required:
                  raw = ((files.get(name) or {}).get("metadata") or {}).get("updatedAt") or ""
                  refreshed.append(datetime.fromisoformat(raw.replace("Z", "+00:00")) >= cutoff)
              fresh = all(refreshed)
          except Exception:
              fresh = False
          sys.exit(0 if fresh else 1)
          PY
            then
              echo "scrape=false" >> "$GITHUB_OUTPUT"
              echo "reason=cloudflare_data_is_fresh" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "scrape=true" >> "$GITHUB_OUTPUT"
          echo "reason=cloudflare_data_stale_or_status_unavailable" >> "$GITHUB_OUTPUT"

      - name: Show refresh decision
        run: |
          echo "scrape=${{ steps.mode.outputs.scrape }}"
          echo "reason=${{ steps.mode.outputs.reason }}"

      - name: Set up Python
        if: steps.mode.outputs.scrape == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/tsugi-checker/requirements.txt

      - name: Install scraper dependencies
        if: steps.mode.outputs.scrape == 'true'
        run: |
          python -m pip install -r apps/tsugi-checker/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Refresh reading, music and news feeds
        if: steps.mode.outputs.scrape == 'true'
        working-directory: apps/tsugi-checker
        run: |
          python scraper/main.py --skip-games
          python scraper/site_dates.py

      - name: Commit refreshed Tsugi data to PT Universe
        if: steps.mode.outputs.scrape == 'true'
        run: |
          git config user.name "pt-universe-tsugi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/tsugi-checker/data/feed.json \
            apps/tsugi-checker/data/feed.xml \
            apps/tsugi-checker/data/state.json \
            apps/tsugi-checker/data/site-updates.json \
            apps/tsugi-checker/data/acg-news.json \
            apps/tsugi-checker/data/music.json
          if git diff --cached --quiet; then
            echo "No Tsugi data changes"
          else
            git commit -m "data(tsugi): refresh feeds"
            # Scheduled/rerun jobs may start from an older branch snapshot.
            # During rebase, prefer this run's freshly generated data on conflicts.
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy the latest PT Universe
        id: deployment
        uses: actions/deploy-pages@v4
