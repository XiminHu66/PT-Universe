name: Refresh Tsugi data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/tsugi-checker/config/**
      - apps/tsugi-checker/scraper/**
      - apps/tsugi-checker/requirements.txt
      - .github/workflows/refresh-tsugi.yml
  schedule:
    # Backup probe; if GitHub delays it past 09:00, it performs the refresh.
    - cron: "17 8 * * *"
      timezone: "America/Los_Angeles"
    # Primary daily refresh.
    - cron: "17 9 * * *"
      timezone: "America/Los_Angeles"

permissions:
  contents: write

concurrency:
  group: pt-universe-tsugi-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out PT Universe
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the scheduled probe should refresh
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "scrape=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual_or_source_change" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LOCAL_HOUR="$(TZ=America/Los_Angeles date +%H)"
          if (( 10#$LOCAL_HOUR < 9 )); then
            echo "scrape=false" >> "$GITHUB_OUTPUT"
            echo "reason=backup_probe_arrived_before_09" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin main --quiet
          if git show origin/main:apps/tsugi-checker/data/site-updates.json > /tmp/tsugi-site-updates.json 2>/dev/null; then
            if python - <<'PY'
          import json, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("America/Los_Angeles")
          now = datetime.now(tz)
          try:
              data = json.load(open("/tmp/tsugi-site-updates.json", encoding="utf-8"))
              raw = data.get("generated_at") or ""
              refreshed = datetime.fromisoformat(raw.replace("Z", "+00:00")).astimezone(tz)
              fresh = refreshed.date() == now.date() and refreshed.hour >= 9
          except Exception:
              fresh = False
          sys.exit(0 if fresh else 1)
          PY
            then
              echo "scrape=false" >> "$GITHUB_OUTPUT"
              echo "reason=already_refreshed_after_09_today" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "scrape=true" >> "$GITHUB_OUTPUT"
          echo "reason=scheduled_morning_refresh_needed" >> "$GITHUB_OUTPUT"

      - name: Show refresh decision
        run: |
          echo "scrape=${{ steps.mode.outputs.scrape }}"
          echo "reason=${{ steps.mode.outputs.reason }}"

      - name: Set up Python
        if: steps.mode.outputs.scrape == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/tsugi-checker/requirements.txt

      - name: Install scraper dependencies
        if: steps.mode.outputs.scrape == 'true'
        run: |
          python -m pip install -r apps/tsugi-checker/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Refresh reading, music, games and news feeds
        if: steps.mode.outputs.scrape == 'true'
        working-directory: apps/tsugi-checker
        run: |
          python scraper/main.py
          python scraper/site_dates.py
          python scraper/steam_pc.py
          python scraper/game_enrich.py

      - name: Commit refreshed Tsugi data to PT Universe
        if: steps.mode.outputs.scrape == 'true'
        run: |
          git config user.name "pt-universe-tsugi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/tsugi-checker/data/feed.json \
            apps/tsugi-checker/data/feed.xml \
            apps/tsugi-checker/data/state.json \
            apps/tsugi-checker/data/site-updates.json \
            apps/tsugi-checker/data/acg-news.json \
            apps/tsugi-checker/data/music.json \
            apps/tsugi-checker/data/game-releases.json \
            apps/tsugi-checker/data/game-state.json
          if git diff --cached --quiet; then
            echo "No Tsugi data changes"
          else
            git commit -m "data(tsugi): refresh feeds"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy the latest PT Universe
        id: deployment
        uses: actions/deploy-pages@v4
