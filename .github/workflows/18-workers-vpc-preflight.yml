name: "18 - Read-only Workers VPC availability check"
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Probe existing Cloudflare account permissions (read-only)
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"
          result_file="$(mktemp)"
          trap 'rm -f "$result_file"' EXIT
          base="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT"
          for route in "/connectivity/directory/services?per_page=1" "/cfd_tunnel?is_deleted=false&per_page=1"; do
            code="$(curl -sS --max-time 25 -o "$result_file" -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" -H 'Accept: application/json' "$base$route")"
            case "$route" in
              *connectivity*) feature=workers-vpc-services ;;
              *) feature=cloudflare-tunnel ;;
            esac
            echo "$feature HTTP $code"
            node - "$result_file" "$feature" <<'JS'
          const fs=require('node:fs');
          const [file,feature]=process.argv.slice(2);
          const json=JSON.parse(fs.readFileSync(file,'utf8'));
          const errorcodes=(json.errors||[]).map(x=>x.code);
          console.log(feature, "api_success",Boolean(json.success),"records_on_first_page",Array.isArray(json.result)?json.result.length:"none","error_codes",errorcodes);
          JS
          done
          echo "PASS: read-only check. No tunnel, VPC service, DNS entry, or Worker created."
