name: Self Learning checks
on:
  push:
    branches: [main]
    paths:
      - 'apps/self-learning/**'
      - 'scripts/self-learning/**'
      - '.github/workflows/self-learning-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Audit teaching content and numeric examples
        run: python3 scripts/self-learning/audit.py
      - name: Verify all courses, diagrams and learning records
        run: node scripts/self-learning/check.cjs
        env:
          TEST_OUTPUT: verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-learning-browser-screenshots
          path: verification/*.png
