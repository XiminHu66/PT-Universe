name: Deploy PT Universe Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - workers/pt-universe-api/**
      - scripts/research/gemini-probe.mjs
      - scripts/decision/life-ai-probe.mjs
      - apps/watch-inbox/report-schema.*
      - .github/workflows/deploy-worker.yml

permissions:
  contents: read

concurrency:
  group: pt-universe-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/pt-universe-api
    steps:
      - name: Check out PT Universe
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workers/pt-universe-api/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Validate Worker
        run: |
          npm run check
          node tests/content-hub.test.mjs
          node tests/check-ai.test.mjs
          node tests/muse.test.mjs
          node tests/gemini-probe.test.mjs
          node tests/research-ai.test.mjs
          node tests/life-ai.test.mjs
          npm run test:media
          npm run types -- --check
          npx wrangler deploy --dry-run

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify deployed content feeds
        run: |
          node --input-type=module <<'JS'
          const api='https://pt-universe-api.summer07-nanjolno.workers.dev/api/hub/';
          for(const route of ['calendar','anime1','topics','discover','assets']){
            let value;
            for(let attempt=0;attempt<6;attempt++){
              const r=await fetch(api+route+'?deployment='+Date.now(),{headers:{'user-agent':'PT-Universe deployment verification',origin:'https://ximinhu66.github.io'},signal:AbortSignal.timeout(45000)});
              value=await r.json();
              if(r.ok&&value.checked_at)break;
              if(attempt===5)throw Error(route+': '+(value.error||r.status));
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
            const count=value.items?.length||value.days?.flatMap(d=>d.items).length||0;
            if(!count)throw Error(route+' returned no real entries');
            console.log(route,count,'entries; last successful fetch',value.checked_at);
          }
          JS

      - name: Verify on-demand Check Desk AI
        if: contains(github.event.head_commit.message, '[check-ai-test]')
        run: node ../../scripts/content-hub/live-check-ai.mjs

      - name: Save Check Desk AI verification
        if: always() && contains(github.event.head_commit.message, '[check-ai-test]')
        uses: actions/upload-artifact@v4
        with:
          name: check-ai-live-verification
          path: /tmp/check-ai-live.json
          if-no-files-found: warn

      - name: Initialize and verify on-demand research workflow
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEARCH_RUN_SMOKE: ${{ contains(github.event.head_commit.message, '[research-ai-test]') }}
        run: node ../../scripts/research/live-ai-smoke.mjs

      - name: Save research workflow verification
        if: always() && contains(github.event.head_commit.message, '[research-ai-test]')
        uses: actions/upload-artifact@v4
        with:
          name: research-ai-live-verification
          path: /tmp/research-ai-live.json
          if-no-files-found: warn

      - name: Measure Gemini free-tier public-paper workflow
        if: contains(github.event.head_commit.message, '[gemini-test]')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node ../../scripts/research/gemini-probe.mjs

      - name: Save Gemini measurement
        if: always() && contains(github.event.head_commit.message, '[gemini-test]')
        uses: actions/upload-artifact@v4
        with:
          name: research-gemini-probe
          path: /tmp/research-gemini-probe.json
          if-no-files-found: warn

      - name: Test Gemini meals and Maps Grounding
        if: contains(github.event.head_commit.message, '[life-ai-test]')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node ../../scripts/decision/life-ai-probe.mjs

      - name: Save meal and map trial results
        if: always() && contains(github.event.head_commit.message, '[life-ai-test]')
        uses: actions/upload-artifact@v4
        with:
          name: life-ai-probe
          path: /tmp/life-ai-probe.json
          if-no-files-found: warn

      - name: Verify deployed collector authentication
        if: always()
        run: |
          node --input-type=module <<'JS'
          const api='https://pt-universe-api.summer07-nanjolno.workers.dev';
          const headers={'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36',accept:'application/json',origin:'https://ximinhu66.github.io'};
          const health=await fetch(api+'/api/health',{headers});
          if(!health.ok)throw Error('Worker health failed');
          const denied=await fetch(api+'/api/decision/11111111-1111-4111-8111-111111111111/sources',{headers});
          if(denied.status!==401)throw Error('Collector endpoint did not enforce authentication: '+denied.status);
          console.log('Deployed collector endpoint responds and enforces owner authentication');
          JS
