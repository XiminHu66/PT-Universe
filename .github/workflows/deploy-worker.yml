name: Deploy PT Universe Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - workers/pt-universe-api/**
      - .github/workflows/deploy-worker.yml

permissions:
  contents: read

concurrency:
  group: pt-universe-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/pt-universe-api
    steps:
      - name: Check out PT Universe
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workers/pt-universe-api/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Validate Worker
        run: |
          npm run check
          npm run types -- --check
          npx wrangler deploy --dry-run

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
