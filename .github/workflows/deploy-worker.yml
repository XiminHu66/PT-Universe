name: Deploy PT Universe Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - workers/pt-universe-api/**
      - apps/watch-inbox/report-schema.*
      - .github/workflows/deploy-worker.yml

permissions:
  contents: read

concurrency:
  group: pt-universe-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/pt-universe-api
    steps:
      - name: Check out PT Universe
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workers/pt-universe-api/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Validate Worker
        run: |
          npm run check
          node tests/muse.test.mjs
          npm run test:media
          npm run types -- --check
          npx wrangler deploy --dry-run

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify deployed collector authentication
        run: |
          node --input-type=module <<'JS'
          const api='https://pt-universe-api.summer07-nanjolno.workers.dev';
          const health=await fetch(api+'/api/health');
          if(!health.ok)throw Error('Worker health failed');
          const denied=await fetch(api+'/api/decision/11111111-1111-4111-8111-111111111111/sources');
          if(denied.status!==401)throw Error('Collector endpoint did not enforce authentication: '+denied.status);
          console.log('Deployed collector endpoint responds and enforces owner authentication');
          JS
