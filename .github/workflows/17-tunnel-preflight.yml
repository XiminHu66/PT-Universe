name: 17 - Read-only Cloudflare Tunnel integration preflight
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
    - name: Check existing Cloudflare token capabilities without changes
      shell: bash
      env:
        CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        set -euo pipefail
        [[ -n "$CF_TOKEN" && -n "$CF_ACCOUNT" ]] || { echo "One or both existing Cloudflare secrets unavailable"; exit 1; }
        tmp="$(mktemp)"
        trap 'rm -f "$tmp"' EXIT
        code="$(curl --silent --show-error --max-time 20 -o "$tmp" -w '%{http_code}' \
          -H "Authorization: Bearer $CF_TOKEN" \
          -H 'Accept: application/json' \
          "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/cfd_tunnel?is_deleted=false&per_page=1")"
        echo "Cloudflare Tunnel read API HTTP status: $code"
        if [[ "$code" == 200 ]]; then
          node -e 'const x=require("fs").readFileSync(process.argv[1],"utf8");const r=JSON.parse(x);console.log("Tunnel list permission:",!!r.success,"tunnel_count_in_page:",Array.isArray(r.result)?r.result.length:"unavailable")' "$tmp"
        else
          echo "Existing API token may lack Cloudflare Tunnel read permission (no changes made)."
        fi
        code="$(curl --silent --show-error --max-time 20 -o "$tmp" -w '%{http_code}' \
          -H "Authorization: Bearer $CF_TOKEN" -H 'Accept: application/json' \
          "https://api.cloudflare.com/client/v4/zones?account.id=$CF_ACCOUNT&per_page=1")"
        echo "Cloudflare Zones read API HTTP status: $code"
        if [[ "$code" == 200 ]]; then
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log("Zones list permission:",!!r.success,"zones_in_page:",Array.isArray(r.result)?r.result.length:"unavailable")' "$tmp"
        else
          echo "Existing API token may lack zone-read permission; a dedicated Cloudflare-managed hostname is not yet verified."
        fi
        echo "PASS: read-only capabilities checked, no tunnels/domains/credentials were created."
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
